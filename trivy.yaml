# SaaS / website: CI fails only on forbidden licenses (CRITICAL), e.g. GPL/AGPL.
# LGPL remains non-CRITICAL so dynamically linked optional binaries
# (e.g. Next.js → sharp) are accepted under Trivy’s default classification.

scan:
  scanners:
    - license
