name: semantyk

networks:
  knowledge:
    name: knowledge
    driver: bridge
  semantyk:
    name: semantyk
    driver: bridge

services:
  knowledge:
    container_name: knowledge
    build: .
    env_file:
      - .env
    ports:
      - "3031:3030"
    volumes:
      - ./src/data:/fuseki/databases
      - ./src/config:/fuseki/configuration
      - ./src/seed:/fuseki/seed
      - ./src/logs:/fuseki/logs
    # Keep declarative *.config.ttl as the only service registry.
    # Fuseki Full also persists services under system/; that duplicates names.
    tmpfs:
      - /fuseki/system:uid=1000,gid=1000,mode=0755
      - /fuseki/system_files:uid=1000,gid=1000,mode=0755
    networks:
      - knowledge
      - semantyk
