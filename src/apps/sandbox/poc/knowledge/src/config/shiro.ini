#
# https://jena.apache.org/documentation/fuseki2/fuseki-security.html
# Dataset write paths use /*/… so new *.config.ttl services inherit auth.
# Note: /$/status is documented as an alias of /$/server but is absent in 6.2.0.

[main]
ssl.enabled = false
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
${ADMIN_USER}=${ADMIN_PASSWORD}

[roles]

[urls]
/$/ping = anon
/$/server = anon
/$/metrics = anon
/$/** = authcBasic,user[${ADMIN_USER}]
/*/update/** = authcBasic,user[${ADMIN_USER}]
/*/data/** = authcBasic,user[${ADMIN_USER}]
/*/upload/** = authcBasic,user[${ADMIN_USER}]
/*/shacl/** = authcBasic,user[${ADMIN_USER}]
/*/prefixes-rw/** = authcBasic,user[${ADMIN_USER}]
/** = anon
