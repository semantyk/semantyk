name: Development CI Workflow

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  projects: read

jobs:
  comply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: 1. Repository Checkout
      - uses: oven-sh/setup-bun@v2
        name: 2. Setup Bun
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        name: 3. Cache Bun install
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        name: 4. Install Dependencies
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: 5. License Policy
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: CRITICAL
          exit-code: "1"
          trivy-config: trivy.yaml

  test:
    runs-on: ubuntu-latest
    needs: comply
    steps:
      - uses: actions/checkout@v7
        name: 1. Repository Checkout
      - uses: oven-sh/setup-bun@v2
        name: 2. Setup Bun
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        name: 3. Cache Bun install
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        name: 4. Install Dependencies
      - run: bun run test
        name: 5. Run Tests
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        name: 1. Repository Checkout
      - uses: oven-sh/setup-bun@v2
        name: 2. Setup Bun
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        name: 3. Cache Bun install
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        name: 4. Install Dependencies
      - run: bun run build
        name: 5. Build
