name: Staging CI Workflow

on:
  push:
    branches:
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  comply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: 1. Repository Checkout
      - uses: oven-sh/setup-bun@v2
        name: 2. Setup Bun
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        name: 3. Cache Bun install
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        name: 4. Install Dependencies
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: 5. License Policy
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: CRITICAL
          exit-code: "1"
          trivy-config: trivy.yaml

  test:
    runs-on: ubuntu-latest
    needs: comply
    steps:
      - uses: actions/checkout@v7
        name: 1. Repository Checkout
      - uses: oven-sh/setup-bun@v2
        name: 2. Setup Bun
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        name: 3. Cache Bun install
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        name: 4. Install Dependencies
      - uses: actions/create-github-app-token@v3
        id: app-token
        name: 5. Generate App Token
        with:
          client-id: ${{ vars.SEMANTYK_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTYK_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - run: bun run test
        name: 6. Run Tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        name: 1. Repository Checkout
      - uses: oven-sh/setup-bun@v2
        name: 2. Setup Bun
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v6
        name: 3. Cache Bun install
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        name: 4. Install Dependencies
      - run: bun run build
        name: 5. Build

  # Temporarily disabled until there is something to deploy (no app.yaml yet).
  deploy:
    if: false
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        name: 1. Repository Checkout
      - uses: google-github-actions/auth@v3
        name: 2. Google Cloud Authentication
        with:
          credentials_json: ${{secrets.GCP_CREDENTIALS}}
      - uses: google-github-actions/setup-gcloud@v3
        name: 3. Cloud SDK Configuration
      - name: 4. Deployment to 'staging' Service
        run: gcloud app deploy app.yaml --project ${{secrets.GCP_PROJECT_ID}} --no-promote
