name: 📓 Docs
title: "📓 "
description: "Improve or add documentation, diagrams, or guides"
type: "📓 Docs"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What to document or correct.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Paths, pages, or diagrams involved (e.g. `doc/spec/plan.test.ts`).
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      options:
        - label: Follow our [Code of Conduct]()
          required: true
        - label: Check that there isn't [already an issue](https://github.com/semantyk/semantyk/issues) for this docs work.
          required: true
