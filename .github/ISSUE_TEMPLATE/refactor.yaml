name: 🔧 Refactor
description: "Request a refactor"
type: "🔧 Refactor"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What to refactor and why (debt, clarity, structure).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Modules, packages, or paths in scope.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this refactor must not change (optional).
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      options:
        - label: Follow our [Code of Conduct]()
          required: true
        - label: Check that there isn't [already an issue](https://github.com/semantyk/semantyk/issues) for this refactor.
          required: true
