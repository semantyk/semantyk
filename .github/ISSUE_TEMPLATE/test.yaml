name: 🧪 Test
description: "Add, fix, or improve automated tests or coverage"
type: "🧪 Test"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What coverage gap or failing test to address.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target
      description: Spec, module, or behavior under test.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Fixtures, commands, or constraints (optional).
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      options:
        - label: Follow our [Code of Conduct]()
          required: true
        - label: Check that there isn't [already an issue](https://github.com/semantyk/semantyk/issues) for this test work.
          required: true
