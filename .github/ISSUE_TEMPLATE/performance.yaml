name: 🚀 Performance
description: "Slow path, regression, or measurable efficiency gain"
type: "🚀 Performance"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is slow or what should improve.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline
      description: Current measurement (time, size, throughput) and how you measured it.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target
      description: Desired outcome or budget.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps or commands to reproduce (optional).
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      options:
        - label: Follow our [Code of Conduct]()
          required: true
        - label: Check that there isn't [already an issue](https://github.com/semantyk/semantyk/issues) for this performance work.
          required: true
